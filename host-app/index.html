<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Remote Desktop — Host</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0c10;
    color: #f2f2f5;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 22px;
  }
  h1 { font-size: 1.1rem; margin: 0 0 14px; }
  label { display: block; font-size: 0.8rem; color: #9a9ba5; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #333644;
    background: #16171e;
    color: #f2f2f5;
    font: inherit;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    border: none;
    background: #4f8cff;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #codeBox {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    background: #16171e;
    border: 1px solid #26283a;
    display: none;
  }
  #codeBox.active { display: block; }
  #codeBox .code { font-size: 2rem; font-weight: 700; letter-spacing: 0.2em; text-align: center; margin: 6px 0; }
  #codeBox .link { text-align: center; font-size: 0.85rem; color: #9a9ba5; margin-top: 8px; word-break: break-all; }
  #status { color: #9a9ba5; font-size: 0.85rem; min-height: 1.3em; margin-top: 10px; }
  #status.error { color: #ff6b6b; }
  #status.ok { color: #6bd97a; }
</style>
</head>
<body>
  <h1>Remote Desktop — Host</h1>
  <p style="color:#9a9ba5;margin-top:0">Click Start Sharing, then give the viewer both the address below and the code.</p>
  <button id="startBtn" type="button">Start Sharing</button>
  <div id="codeBox">
    <label>Viewer should open</label>
    <div class="link" id="linkDisplay">—</div>
    <label style="margin-top:10px">Code to enter there</label>
    <div class="code" id="codeDisplay">------</div>
  </div>
  <p id="status"></p>

  <audio id="remoteMicAudio" autoplay></audio>
  <script src="renderer.js"></script>
</body>
</html>
